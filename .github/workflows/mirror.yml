name: Mirror mdrbnbd/bakikhata to dfaster.github.io/bakikhata
on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mdrbnbd/bakikhata
          ref: main
          path: site
      - run: rm -rf site/.git site/.github site/CNAME site/android-app site/tools
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: d
        uses: actions/deploy-pages@v4
